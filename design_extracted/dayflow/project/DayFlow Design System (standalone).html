document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"es\"><head>\n<meta charset=\"UTF-8\">\n<title>DayFlow · Design System<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n\n<style>\n:root {\n  /* — Base palette — */\n  --bg:           #0E0F13;\n  --surface:      #181A20;\n  --surface-2:    #1F222A;\n  --surface-hi:   #262A33;\n  --border:       rgba(255,255,255,0.07);\n  --border-strong:rgba(255,255,255,0.12);\n\n  --text:         #F2F3F7;\n  --text-dim:     #A4A8B3;\n  --text-mute:    #6B6F7A;\n\n  /* — Brand — */\n  --blue:         #3D7BFF;\n  --blue-soft:    rgba(61,123,255,0.15);\n  --blue-deep:    #2A5BC8;\n  --violet:       #7C3AED;\n\n  /* — Categories — */\n  --cat-academic: #3D7BFF;\n  --cat-health:   #22C55E;\n  --cat-personal: #F59E0B;\n\n  /* — Semantic — */\n  --success:      #22C55E;\n  --warning:      #F59E0B;\n  --danger:       #EF4444;\n  --info:         #38BDF8;\n\n  /* — Type — */\n  --font: \"Inter\", -apple-system, BlinkMacSystemFont, \"SF Pro Display\",\n          \"Segoe UI\", system-ui, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, Menlo, monospace;\n\n  /* — Radii — */\n  --r-xs: 6px;\n  --r-sm: 10px;\n  --r-md: 14px;\n  --r-lg: 18px;\n  --r-xl: 24px;\n  --r-pill: 999px;\n\n  /* — Spacing scale (4-pt grid) — */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 20px;\n  --s-6: 24px;\n  --s-8: 32px;\n  --s-10:40px;\n  --s-12:48px;\n\n  /* — Shadows — */\n  --shadow-1: 0 2px 8px rgba(0,0,0,0.25);\n  --shadow-2: 0 8px 24px rgba(0,0,0,0.35);\n  --shadow-3: 0 16px 40px rgba(0,0,0,0.45);\n  --glow-blue: 0 8px 24px rgba(61,123,255,0.40);\n  --glow-amber: 0 8px 24px rgba(245,158,11,0.35);\n  --glow-green: 0 8px 24px rgba(34,197,94,0.35);\n}\n\n* { box-sizing: border-box; }\nhtml, body {\n  margin: 0; padding: 0; background: var(--bg); color: var(--text);\n  font-family: var(--font); -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"ss01\", \"cv01\";\n}\na { color: var(--blue); text-decoration: none; }\n\n/* Layout shell */\n.wrap {\n  max-width: 1240px; margin: 0 auto; padding: 48px 36px 96px;\n}\n\n.hero {\n  display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px;\n  padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 48px;\n}\n.hero h1 {\n  margin: 0; font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1;\n}\n.hero .eyebrow {\n  display: inline-flex; gap: 8px; align-items: center;\n  padding: 6px 12px; border-radius: var(--r-pill);\n  background: var(--blue-soft); color: var(--blue);\n  font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;\n  margin-bottom: 14px;\n}\n.hero .eyebrow::before {\n  content: ''; width: 8px; height: 8px; border-radius: 4px; background: var(--blue);\n}\n.hero p { margin: 14px 0 0; color: var(--text-dim); font-size: 16px; max-width: 60ch; line-height: 1.5; }\n.hero .logo-mark {\n  width: 96px; height: 96px; border-radius: 28px;\n  background: linear-gradient(135deg, var(--blue) 0%, var(--violet) 100%);\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 16px 48px rgba(61,123,255,0.40);\n  position: relative; overflow: hidden;\n}\n.hero .logo-mark::after {\n  content: ''; position: absolute; top: -30%; right: -30%;\n  width: 70%; height: 70%; border-radius: 50%;\n  background: rgba(255,255,255,0.18);\n}\n\n/* Section header */\nsection { margin-top: 72px; }\n.section-head {\n  display: flex; align-items: baseline; justify-content: space-between;\n  border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 28px;\n}\n.section-head h2 {\n  margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.6px;\n}\n.section-head .num {\n  color: var(--text-mute); font-family: var(--font-mono); font-size: 12px;\n  letter-spacing: 1.2px; text-transform: uppercase;\n}\n.section-head .sub {\n  color: var(--text-dim); font-size: 14px; font-weight: 500;\n  max-width: 60ch; margin-top: 6px;\n}\n\n/* Subsection title */\n.sub-head {\n  font-size: 12px; font-weight: 700; color: var(--text-dim);\n  letter-spacing: 0.8px; text-transform: uppercase;\n  margin: 28px 0 14px;\n}\n\n/* — Color swatches — */\n.swatches {\n  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px;\n}\n.swatch {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--r-md); overflow: hidden;\n}\n.swatch .chip {\n  height: 92px; width: 100%; position: relative;\n}\n.swatch .chip-on-bg {\n  position: absolute; left: 12px; bottom: 12px;\n  width: 24px; height: 24px; border-radius: 8px;\n  background: var(--bg); border: 1px solid var(--border-strong);\n}\n.swatch .meta { padding: 12px 14px 14px; }\n.swatch .name {\n  font-size: 13.5px; font-weight: 700; letter-spacing: -0.2px;\n  display: flex; justify-content: space-between; align-items: baseline;\n}\n.swatch .name .role { color: var(--text-mute); font-weight: 500; font-size: 11px; }\n.swatch .hex {\n  margin-top: 4px; font-family: var(--font-mono); font-size: 11.5px;\n  color: var(--text-dim); letter-spacing: 0.2px;\n}\n.swatch .token {\n  margin-top: 8px; font-family: var(--font-mono); font-size: 10.5px;\n  color: var(--text-mute); padding: 3px 7px; border-radius: 6px;\n  background: var(--surface-2); display: inline-block;\n}\n\n/* Neutrals row */\n.neutrals {\n  display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;\n}\n.neutral {\n  border-radius: var(--r-sm); overflow: hidden;\n  border: 1px solid var(--border);\n}\n.neutral .chip { height: 80px; }\n.neutral .meta { padding: 10px; background: var(--surface); }\n.neutral .name { font-size: 11.5px; font-weight: 700; }\n.neutral .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }\n\n/* — Typography — */\n.type-row {\n  display: grid; grid-template-columns: 200px 1fr auto; gap: 24px; align-items: baseline;\n  padding: 22px 0; border-bottom: 1px solid var(--border);\n}\n.type-row:last-child { border-bottom: none; }\n.type-row .label {\n  font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);\n  letter-spacing: 0.8px; text-transform: uppercase;\n}\n.type-row .label .name {\n  display: block; color: var(--text); font-family: var(--font);\n  font-size: 14px; font-weight: 700; letter-spacing: -0.2px; text-transform: none;\n  margin-bottom: 4px;\n}\n.type-row .specs {\n  font-family: var(--font-mono); font-size: 11px; color: var(--text-mute);\n  text-align: right; white-space: nowrap;\n}\n\n.font-card {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--r-lg); padding: 24px; margin-bottom: 14px;\n  display: grid; grid-template-columns: 200px 1fr; gap: 30px; align-items: center;\n}\n.font-card .face {\n  font-size: 88px; font-weight: 700; letter-spacing: -3px; line-height: 1;\n  color: var(--text);\n}\n.font-card .info .name { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }\n.font-card .info .meta { color: var(--text-dim); font-size: 13px; margin-top: 4px; }\n.font-card .weights {\n  margin-top: 18px; display: flex; flex-wrap: wrap; gap: 14px 24px;\n}\n.font-card .weights span { font-size: 14px; color: var(--text-dim); }\n.font-card .weights span b { color: var(--text); margin-right: 6px; font-weight: 800; }\n\n/* — Spacing — */\n.spacing-list {\n  display: flex; flex-direction: column; gap: 6px;\n}\n.spacing-row {\n  display: grid; grid-template-columns: 80px 80px 1fr 100px; gap: 18px; align-items: center;\n  padding: 10px 14px; border-radius: var(--r-sm);\n  background: var(--surface); border: 1px solid var(--border);\n}\n.spacing-row .token { font-family: var(--font-mono); font-size: 12.5px; color: var(--text); }\n.spacing-row .px    { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }\n.spacing-row .bar   { height: 10px; background: var(--blue); border-radius: 5px;\n                      box-shadow: 0 0 12px rgba(61,123,255,0.4); }\n.spacing-row .use   { font-size: 11.5px; color: var(--text-mute); text-align: right; }\n\n/* — Radii — */\n.radii {\n  display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px;\n}\n.radii .item {\n  display: flex; flex-direction: column; align-items: center; gap: 10px;\n}\n.radii .demo {\n  width: 86px; height: 86px;\n  background: linear-gradient(135deg, var(--blue), var(--violet));\n  border: 1px solid rgba(255,255,255,0.15);\n}\n.radii .name { font-family: var(--font-mono); font-size: 11.5px; color: var(--text); }\n.radii .px { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); }\n\n/* — Shadows — */\n.shadows { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 22px; }\n.shadow-card {\n  height: 110px; border-radius: var(--r-md); background: var(--surface);\n  border: 1px solid var(--border);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim);\n}\n.shadow-card.s1 { box-shadow: var(--shadow-1); }\n.shadow-card.s2 { box-shadow: var(--shadow-2); }\n.shadow-card.s3 { box-shadow: var(--shadow-3); }\n.shadow-card.glow-blue { box-shadow: var(--glow-blue); }\n.shadow-card.glow-amber { box-shadow: var(--glow-amber); }\n.shadow-card.glow-green { box-shadow: var(--glow-green); }\n\n/* — Components — */\n.comp-grid {\n  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;\n}\n.comp {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--r-lg); padding: 22px;\n}\n.comp .title {\n  font-size: 12px; font-weight: 700; color: var(--text-dim);\n  letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 14px;\n}\n.comp .demo { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }\n.comp .demo.col { flex-direction: column; align-items: stretch; }\n\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n  height: 44px; padding: 0 18px; border-radius: var(--r-md);\n  font-family: var(--font); font-size: 14px; font-weight: 700; letter-spacing: -0.2px;\n  border: none; cursor: pointer; transition: all .15s;\n}\n.btn.primary { background: var(--blue); color: #fff; box-shadow: var(--glow-blue); }\n.btn.primary:hover { background: var(--blue-deep); }\n.btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); }\n.btn.success { background: var(--success); color: #0E0F13; box-shadow: var(--glow-green); }\n.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--border-strong); }\n.btn.ghost { background: transparent; color: var(--text-dim); }\n.btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: var(--r-sm); }\n.btn.icon { width: 44px; padding: 0; }\n\n.chip {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 14px; border-radius: var(--r-pill);\n  font-family: var(--font); font-size: 12.5px; font-weight: 600; letter-spacing: -0.1px;\n  border: 1px solid var(--border-strong); color: var(--text-dim); background: transparent;\n}\n.chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }\n.chip.academic { background: rgba(61,123,255,0.18); color: var(--cat-academic); border: none; }\n.chip.health   { background: rgba(34,197,94,0.18);  color: var(--cat-health);   border: none; }\n.chip.personal { background: rgba(245,158,11,0.18); color: var(--cat-personal); border: none; }\n.chip .dot { width: 6px; height: 6px; border-radius: 3px; background: currentColor; }\n\n.input-demo {\n  display: flex; align-items: center; gap: 10px;\n  background: var(--surface-2); border: 1.5px solid var(--border); border-radius: var(--r-md);\n  padding: 0 14px; height: 48px; width: 100%;\n}\n.input-demo.focused { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(61,123,255,0.13); }\n.input-demo .val { color: var(--text); font-size: 14.5px; font-weight: 500; flex: 1; }\n.input-demo .ph  { color: var(--text-mute); font-size: 14.5px; flex: 1; }\n\n.toggle {\n  width: 42px; height: 24px; border-radius: 12px; background: var(--surface-hi);\n  position: relative; flex-shrink: 0; transition: background .2s;\n}\n.toggle::after {\n  content: ''; position: absolute; top: 2px; left: 2px;\n  width: 20px; height: 20px; border-radius: 10px; background: #fff;\n  transition: transform .2s;\n}\n.toggle.on { background: var(--blue); }\n.toggle.on::after { transform: translateX(18px); }\n\n.checkbox-demo {\n  width: 22px; height: 22px; border-radius: 11px;\n  border: 1.8px solid var(--border-strong); display: inline-block;\n}\n.checkbox-demo.on {\n  background: var(--success); border-color: var(--success); position: relative;\n}\n.checkbox-demo.on::after {\n  content: ''; position: absolute; top: 50%; left: 50%;\n  width: 9px; height: 5px; border-left: 2.4px solid #0E0F13; border-bottom: 2.4px solid #0E0F13;\n  transform: translate(-50%, -70%) rotate(-45deg);\n}\n\n/* Mini card sample (Home summary) */\n.summary-mini {\n  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%;\n}\n.summary-mini .card {\n  border-radius: var(--r-md); padding: 14px 12px; color: #fff; min-height: 100px;\n  display: flex; flex-direction: column; justify-content: space-between;\n}\n.summary-mini .card .v { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -0.8px; }\n.summary-mini .card .l { font-size: 11px; font-weight: 600; opacity: 0.92; margin-top: 4px; }\n.summary-mini .card .ic {\n  width: 24px; height: 24px; border-radius: 6px; background: rgba(255,255,255,0.25);\n}\n.summary-mini .c-blue { background: var(--cat-academic); box-shadow: 0 8px 20px rgba(61,123,255,0.3); }\n.summary-mini .c-green { background: var(--cat-health); box-shadow: 0 8px 20px rgba(34,197,94,0.3); }\n.summary-mini .c-orange { background: var(--cat-personal); box-shadow: 0 8px 20px rgba(245,158,11,0.3); }\n\n/* Iconography */\n.icons {\n  display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px;\n}\n.icon-cell {\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);\n  padding: 14px 8px; display: flex; flex-direction: column; align-items: center;\n  gap: 8px;\n}\n.icon-cell svg { color: var(--text); }\n.icon-cell .n { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }\n\n/* Voice and tone */\n.tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }\n.tone {\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);\n  padding: 20px 22px;\n}\n.tone.do  { border-left: 4px solid var(--success); }\n.tone.dont { border-left: 4px solid var(--danger); }\n.tone .lbl {\n  font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;\n  display: inline-flex; align-items: center; gap: 6px;\n}\n.tone.do .lbl { color: var(--success); }\n.tone.dont .lbl { color: var(--danger); }\n.tone ul { margin: 12px 0 0; padding: 0 0 0 16px; }\n.tone li { color: var(--text-dim); font-size: 13.5px; line-height: 1.7; }\n.tone li b { color: var(--text); }\n\n/* Token reference */\n.token-table {\n  width: 100%; border-collapse: collapse;\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);\n  overflow: hidden;\n}\n.token-table th, .token-table td {\n  text-align: left; padding: 12px 18px; font-size: 13px;\n  border-bottom: 1px solid var(--border);\n}\n.token-table th {\n  font-size: 11px; font-weight: 700; color: var(--text-dim);\n  letter-spacing: 0.6px; text-transform: uppercase; background: var(--surface-2);\n}\n.token-table td.token { font-family: var(--font-mono); font-size: 12px; color: var(--blue); }\n.token-table td.value { font-family: var(--font-mono); font-size: 12px; color: var(--text); }\n.token-table td.desc { color: var(--text-dim); }\n.token-table tr:last-child td { border-bottom: none; }\n\n/* Footer */\nfooter {\n  margin-top: 96px; padding-top: 24px; border-top: 1px solid var(--border);\n  display: flex; justify-content: space-between; align-items: center;\n  font-size: 12px; color: var(--text-mute);\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"wrap\">\n  <!-- HERO -->\n  <header class=\"hero\">\n    <div>\n      <div class=\"eyebrow\">Design System · v1.0<\u002Fdiv>\n      <h1>DayFlow<\u002Fh1>\n      <p>\n        Sistema de diseño para la app DayFlow en Flutter — tema oscuro, basado en\n        Material 3. Define los tokens, tipografía, componentes y patrones visuales\n        que mantienen la coherencia entre las 15 pantallas.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"logo-mark\">\n      <svg width=\"56\" height=\"56\" viewBox=\"0 0 24 24\" fill=\"none\">\n        <path d=\"M5 4h7a8 8 0 010 16H5V4z\" fill=\"#fff\"><\u002Fpath>\n        <circle cx=\"17\" cy=\"12\" r=\"2.2\" fill=\"#3D7BFF\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- 01 COLORS -->\n  <section>\n    <div class=\"section-head\">\n      <div>\n        <h2>Colores<\u002Fh2>\n        <div class=\"sub\">Una paleta dark-first con un azul de marca como acento principal y 3 categorías para clasificar actividades.<\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"num\">01 · Color<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"sub-head\">Marca<\u002Fdiv>\n    <div class=\"swatches\">\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--blue);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Blue / Primary <span class=\"role\">Acento<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">#3D7BFF<\u002Fdiv>\n          <span class=\"token\">--blue<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--blue-deep);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Blue Deep <span class=\"role\">Hover / press<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">#2A5BC8<\u002Fdiv>\n          <span class=\"token\">--blue-deep<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--blue-soft);\">\n          <div class=\"chip-on-bg\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Blue Soft <span class=\"role\">Tinte 15%<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">rgba(61,123,255,.15)<\u002Fdiv>\n          <span class=\"token\">--blue-soft<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--violet);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Violet <span class=\"role\">Gradient pair<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">#7C3AED<\u002Fdiv>\n          <span class=\"token\">--violet<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: linear-gradient(135deg, var(--blue), var(--violet));\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Brand Gradient <span class=\"role\">Avatar / hero<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">linear-gradient(135deg, #3D7BFF, #7C3AED)<\u002Fdiv>\n          <span class=\"token\">--brand-gradient<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sub-head\" style=\"margin-top: 36px;\">Categorías de actividades<\u002Fdiv>\n    <div class=\"swatches\">\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--cat-academic);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Académica <span class=\"role\">Estudio<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">#3D7BFF<\u002Fdiv>\n          <span class=\"token\">--cat-academic<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--cat-health);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Salud <span class=\"role\">Ejercicio · médico<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">#22C55E<\u002Fdiv>\n          <span class=\"token\">--cat-health<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--cat-personal);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Personal <span class=\"role\">Compras · familia<\u002Fspan><\u002Fdiv>\n          <div class=\"hex\">#F59E0B<\u002Fdiv>\n          <span class=\"token\">--cat-personal<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sub-head\" style=\"margin-top: 36px;\">Semánticos<\u002Fdiv>\n    <div class=\"swatches\">\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--success);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Success<\u002Fdiv>\n          <div class=\"hex\">#22C55E<\u002Fdiv>\n          <span class=\"token\">--success<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--warning);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Warning<\u002Fdiv>\n          <div class=\"hex\">#F59E0B<\u002Fdiv>\n          <span class=\"token\">--warning<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--danger);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Danger<\u002Fdiv>\n          <div class=\"hex\">#EF4444<\u002Fdiv>\n          <span class=\"token\">--danger<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div class=\"chip\" style=\"background: var(--info);\"><\u002Fdiv>\n        <div class=\"meta\">\n          <div class=\"name\">Info<\u002Fdiv>\n          <div class=\"hex\">#38BDF8<\u002Fdiv>\n          <span class=\"token\">--info<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sub-head\" style=\"margin-top: 36px;\">Neutrales / superficies (dark)<\u002Fdiv>\n    <div class=\"neutrals\">\n      <div class=\"neutral\"><div class=\"chip\" style=\"background: var(--bg);\"><\u002Fdiv>\n        <div class=\"meta\"><div class=\"name\">bg<\u002Fdiv><div class=\"hex\">#0E0F13<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"neutral\"><div class=\"chip\" style=\"background: var(--surface);\"><\u002Fdiv>\n        <div class=\"meta\"><div class=\"name\">surface<\u002Fdiv><div class=\"hex\">#181A20<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"neutral\"><div class=\"chip\" style=\"background: var(--surface-2);\"><\u002Fdiv>\n        <div class=\"meta\"><div class=\"name\">surface-2<\u002Fdiv><div class=\"hex\">#1F222A<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"neutral\"><div class=\"chip\" style=\"background: var(--surface-hi);\"><\u002Fdiv>\n        <div class=\"meta\"><div class=\"name\">surface-hi<\u002Fdiv><div class=\"hex\">#262A33<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"neutral\"><div class=\"chip\" style=\"background: var(--text-mute);\"><\u002Fdiv>\n        <div class=\"meta\"><div class=\"name\">text-mute<\u002Fdiv><div class=\"hex\">#6B6F7A<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"neutral\"><div class=\"chip\" style=\"background: var(--text-dim);\"><\u002Fdiv>\n        <div class=\"meta\"><div class=\"name\">text-dim<\u002Fdiv><div class=\"hex\">#A4A8B3<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"neutral\"><div class=\"chip\" style=\"background: var(--text);\"><\u002Fdiv>\n        <div class=\"meta\"><div class=\"name\">text<\u002Fdiv><div class=\"hex\">#F2F3F7<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 TYPOGRAPHY -->\n  <section>\n    <div class=\"section-head\">\n      <div>\n        <h2>Tipografía<\u002Fh2>\n        <div class=\"sub\">Inter para UI y JetBrains Mono para datos numéricos / tokens. Material 3 type scale adaptada para móvil.<\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"num\">02 · Type<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"font-card\">\n      <div class=\"face\">Aa<\u002Fdiv>\n      <div class=\"info\">\n        <div class=\"name\">Inter<\u002Fdiv>\n        <div class=\"meta\">UI principal · Google Fonts · open source<\u002Fdiv>\n        <div class=\"weights\">\n          <span><b style=\"font-weight: 400;\">Regular<\u002Fb> 400<\u002Fspan>\n          <span><b style=\"font-weight: 500;\">Medium<\u002Fb> 500<\u002Fspan>\n          <span><b style=\"font-weight: 600;\">Semibold<\u002Fb> 600<\u002Fspan>\n          <span><b style=\"font-weight: 700;\">Bold<\u002Fb> 700<\u002Fspan>\n          <span><b style=\"font-weight: 800;\">Extrabold<\u002Fb> 800<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"font-card\" style=\"grid-template-columns: 200px 1fr;\">\n      <div class=\"face\" style=\"font-family: var(--font-mono); font-size: 64px; letter-spacing: -1px;\">12<br>:34<\u002Fdiv>\n      <div class=\"info\">\n        <div class=\"name\" style=\"font-family: var(--font-mono);\">JetBrains Mono<\u002Fdiv>\n        <div class=\"meta\">Datos numéricos · horas · tokens · cifras tabulares<\u002Fdiv>\n        <div class=\"weights\" style=\"font-family: var(--font-mono);\">\n          <span><b>Regular<\u002Fb> 400<\u002Fspan>\n          <span><b>Medium<\u002Fb> 500<\u002Fspan>\n          <span><b>Bold<\u002Fb> 700<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sub-head\" style=\"margin-top: 28px;\">Escala tipográfica<\u002Fdiv>\n    <div style=\"background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 8px 28px;\">\n      <div
