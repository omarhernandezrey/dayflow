<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>DayFlow · App Flutter (Dark) — Print</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #efeae0;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
               -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  * { box-sizing: border-box; }
  @keyframes dfBlink { 50% { opacity: 0; } }

  /* Screen view: scrollable stack */
  .page {
    width: 297mm; height: 210mm;
    padding: 14mm 14mm 12mm;
    margin: 0 auto 12px;
    background: #efeae0;
    page-break-after: always;
    break-after: page;
    page-break-inside: avoid;
    break-inside: avoid;
    display: flex; flex-direction: column;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  .page-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8mm;
    border-bottom: 1px solid rgba(40,30,20,0.15);
    padding-bottom: 6mm;
  }
  .section-title {
    font-size: 24px; font-weight: 800; color: #2a251f;
    letter-spacing: -0.5px; line-height: 1.1;
  }
  .section-subtitle {
    margin-top: 4px; font-size: 12px; color: rgba(60,50,40,0.65);
    font-weight: 500; max-width: 60ch;
  }
  .page-num {
    font-size: 11px; color: rgba(60,50,40,0.55);
    font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
    white-space: nowrap;
  }

  /* Cover page */
  .cover {
    background: #0E0F13;
    color: #F2F3F7;
    align-items: stretch; justify-content: space-between;
  }
  .cover .section-title { color: #fff; font-size: 64px; }
  .cover .section-subtitle { color: rgba(255,255,255,0.7); font-size: 16px; }
  .cover .page-num { color: rgba(255,255,255,0.5); }
  .cover-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20mm;
                margin-top: 14mm; }
  .cover-meta-item { }
  .cover-meta-item .v { font-size: 36px; font-weight: 800; color: #3D7BFF;
                        letter-spacing: -1px; line-height: 1; }
  .cover-meta-item .l { margin-top: 8px; font-size: 12px;
                        color: rgba(255,255,255,0.6); font-weight: 500; }
  .cover-footer { font-size: 11px; color: rgba(255,255,255,0.45);
                  letter-spacing: 0.6px; text-transform: uppercase; font-weight: 600; }

  /* Phone grid */
  .phones {
    flex: 1;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14mm; align-items: start; justify-items: center;
  }
  .phone-cell {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
  }
  .phone-label {
    font-size: 12px; font-weight: 700; color: #2a251f;
    letter-spacing: -0.1px;
    text-align: center;
  }
  .phone-label .num { color: #3D7BFF; margin-right: 6px; font-weight: 800; }
  .phone-frame { transform: scale(0.78); transform-origin: top center; }
  .phone-cell.tall { margin-bottom: -40mm; }  /* compensate scale */

  @media print {
    html, body { background: #fff; }
    .page { margin: 0; box-shadow: none; }
    @page { size: A4 landscape; margin: 0; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="main-screens.jsx"></script>
<script type="text/babel" src="extra-screens.jsx"></script>
<script type="text/babel" src="auth-screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
// Screen list organized by section. Each section becomes one (or more) pages,
// with up to 2 phones per landscape page.
const SECTIONS = [
  {
    id: 'auth', title: 'Autenticación',
    subtitle: 'Splash, login, registro y recuperación de contraseña',
    screens: [
      { id: 'splash',   num: '00', label: 'Splash / Bienvenida',  C: SplashScreen },
      { id: 'login',    num: '01', label: 'Iniciar sesión',       C: LoginScreen },
      { id: 'register', num: '02', label: 'Crear cuenta',         C: RegisterScreen },
      { id: 'forgot',   num: '03', label: 'Recuperar contraseña', C: ForgotPasswordScreen },
    ],
  },
  {
    id: 'main', title: 'Pantallas principales',
    subtitle: 'Las 5 vistas del Bottom Navigation Bar — versiones en modo oscuro',
    screens: [
      { id: 'home',    num: '01', label: 'Home / Dashboard', C: HomeScreen },
      { id: 'tareas',  num: '02', label: 'Tareas',           C: TareasScreen },
      { id: 'habitos', num: '03', label: 'Hábitos',          C: HabitosScreen },
      { id: 'stats',   num: '04', label: 'Estadísticas',     C: EstadisticasScreen },
      { id: 'mas',     num: '05', label: 'Más',              C: MasScreen },
    ],
  },
  {
    id: 'create', title: 'Crear · Editar',
    subtitle: 'RF1, RF2, RF8 — registro y gestión de actividades y hábitos',
    screens: [
      { id: 'add-task',    num: '06', label: 'Nueva tarea (RF1)',  C: AddTaskScreen },
      { id: 'add-habit',   num: '07', label: 'Nuevo hábito (RF8)', C: AddHabitScreen },
      { id: 'task-detail', num: '08', label: 'Detalle de tarea',   C: TaskDetailScreen },
    ],
  },
  {
    id: 'system', title: 'Soporte y sistema',
    subtitle: 'Notificaciones locales (RF4), menú lateral y perfil con logros',
    screens: [
      { id: 'notifs',  num: '09', label: 'Notificaciones (RF4)', C: NotificationsScreen },
      { id: 'menu',    num: '10', label: 'Menú lateral',         C: MenuScreen },
      { id: 'profile', num: '11', label: 'Mi perfil · Logros',   C: ProfileScreen },
    ],
  },
];

function chunk(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

function PhoneCell({ s }) {
  const C = s.C;
  return (
    <div className="phone-cell tall">
      <div className="phone-label">
        <span className="num">{s.num}</span>{s.label}
      </div>
      <div className="phone-frame">
        <C />
      </div>
    </div>
  );
}

function Cover() {
  const total = SECTIONS.reduce((a, s) => a + s.screens.length, 0);
  return (
    <div className="page cover">
      <div>
        <div className="page-num">DayFlow · v1.0.0</div>
        <div style={{ marginTop: '60mm' }}>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 12,
            padding: '6px 14px', borderRadius: 999,
            background: 'rgba(61,123,255,0.18)',
            color: '#3D7BFF',
            fontSize: 12, fontWeight: 700, letterSpacing: 0.6,
            textTransform: 'uppercase',
          }}>
            <span style={{ width: 8, height: 8, borderRadius: 4, background: '#3D7BFF' }} />
            App móvil · Flutter · Dark
          </div>
          <div className="section-title" style={{ marginTop: 18 }}>DayFlow</div>
          <div className="section-subtitle" style={{ marginTop: 12, maxWidth: '60ch' }}>
            Organiza tu día. Construye mejores hábitos.<br/>
            Gestión personal offline-first con notificaciones locales,
            seguimiento de hábitos y estadísticas semanales.
          </div>
        </div>
        <div className="cover-meta">
          <div className="cover-meta-item">
            <div className="v">{total}</div>
            <div className="l">Pantallas diseñadas</div>
          </div>
          <div className="cover-meta-item">
            <div className="v">{SECTIONS.length}</div>
            <div className="l">Secciones / módulos</div>
          </div>
          <div className="cover-meta-item">
            <div className="v">8</div>
            <div className="l">Requerimientos funcionales</div>
          </div>
        </div>
      </div>
      <div className="cover-footer">
        Politécnico Grancolombiano · Énfasis en Programación Móvil · Subgrupo 10
      </div>
    </div>
  );
}

function SectionPages({ section, startPageNum }) {
  const pages = chunk(section.screens, 2);
  return pages.map((scrs, i) => (
    <div className="page" key={`${section.id}-${i}`}>
      <div className="page-header">
        <div>
          <div className="section-title">{section.title}</div>
          <div className="section-subtitle">{section.subtitle}</div>
        </div>
        <div className="page-num">
          {section.title} · {i + 1} / {pages.length}
        </div>
      </div>
      <div className="phones">
        {scrs.map(s => <PhoneCell key={s.id} s={s} />)}
      </div>
    </div>
  ));
}

function App() {
  return (
    <>
      <Cover />
      {SECTIONS.map(sec => <SectionPages key={sec.id} section={sec} />)}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Auto-print once everything is ready
(async () => {
  // Wait for fonts
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }
  // Safety delay for JSX transforms / layout
  await new Promise(r => setTimeout(r, 600));
  window.print();
})();
</script>
</body>
</html>
